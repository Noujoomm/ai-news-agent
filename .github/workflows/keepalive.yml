# GitHub يوقف الجدولة تلقائيًا لو الريبو ما فيه أي نشاط ٦٠ يوم.
# هذا الملف يسوي كوميت صغير كل أسبوع عشان المراقبة ما تتوقف أبدًا.
name: Keepalive

on:
  schedule:
    - cron: "0 6 * * 1" # كل يوم اثنين
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: تحديث نبضة النشاط
        run: |
          date -u +"آخر نبضة: %Y-%m-%d %H:%M UTC" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git diff --staged --quiet || git commit -m "chore: نبضة إبقاء الجدولة شغالة"
          git push
